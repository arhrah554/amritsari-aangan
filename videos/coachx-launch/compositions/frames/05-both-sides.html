    <script>
      (function () {
        var FID = "05-both-sides";
        var D = 6.861;
        var root = document.querySelector('[data-composition-id="' + FID + '"]');
        function $(id) {
          return root.querySelector('[id="' + FID + "-" + id + '"]');
        }

        // VO cues (seconds from frame start)
        var CUE_ONE = 0.12; // "One app."
        var CUE_BOTH = 1.16; // "Both sides…"
        var CUE_REP = 1.78; // "…of the rep."
        var CUE_COACH = 2.79; // "Coaches build."
        var CUE_ATH = 4.04; // "Athletes train."
        var CUE_SYNC = 5.37; // "Everything syncs."

        var tl = gsap.timeline({ paused: true });
        tl.to({}, { duration: D }, 0); // length anchor

        // ---- macro camera: slow push on the stage, X drifts the other way ----
        tl.fromTo($("stage"), { scale: 1 }, { scale: 1.035, duration: D, ease: "none" }, 0);
        tl.fromTo(
          $("x"),
          { opacity: 0, scale: 1.08, rotation: -2 },
          { opacity: 0.055, scale: 1, rotation: 0, duration: 1.2, ease: "power2.out" },
          0
        );
        tl.fromTo($("x"), { x: 0, y: 0 }, { x: -36, y: 24, duration: D, ease: "none" }, 0);

        // ---- Scene 1 (0.0–1.16): kicker + "ONE APP." slam ----
        ["c1", "c2", "c3", "c4"].forEach(function (c, i) {
          tl.fromTo($(c), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.02 + i * 0.04);
        });
        tl.fromTo($("stub"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.0);
        tl.fromTo(
          $("kicker-text"),
          { opacity: 0, x: -16, scaleX: 1.3, transformOrigin: "0% 50%" },
          { opacity: 1, x: 0, scaleX: 1, duration: 0.55, ease: "power3.out" },
          0.04
        );
        tl.fromTo(
          $("l1"),
          { opacity: 0, scale: 1.45, filter: "blur(18px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
          CUE_ONE
        );
        // impact recoil on the slam
        tl.fromTo($("l1"), { y: 0 }, { y: 6, duration: 0.08, ease: "power2.out" }, CUE_ONE + 0.36);
        tl.to($("l1"), { y: 0, duration: 0.3, ease: "power2.out" }, CUE_ONE + 0.44);

        // ---- Scene 2 (1.16–2.79): outline "BOTH SIDES", chrome "OF THE REP." ----
        tl.fromTo(
          $("l2"),
          { opacity: 0, y: 40, filter: "blur(14px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
          CUE_BOTH
        );
        tl.fromTo(
          $("l3"),
          { opacity: 0, y: 40, filter: "blur(14px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
          CUE_REP
        );

        // ---- Scene 3 (2.79–5.37): hairline draws, beats tick in left→right ----
        tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, CUE_COACH - 0.24);

        function beat(n, t) {
          tl.fromTo(
            $("d" + n),
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
            t
          );
          tl.fromTo($("n" + n), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, t + 0.04);
          tl.fromTo(
            $("t" + n),
            { opacity: 0, y: 22, filter: "blur(8px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" },
            t
          );
        }
        beat(1, CUE_COACH);
        // one specular pass across the chrome line, filling the gap before beat 2
        tl.fromTo(
          $("spec"),
          { backgroundPosition: "100% 0%" },
          { backgroundPosition: "0% 0%", duration: 0.9, ease: "power1.inOut" },
          3.15
        );
        beat(2, CUE_ATH);

        // ---- Scene 4 (5.37–6.86): third beat + pulse connects the dots, glow, hold ----
        beat(3, CUE_SYNC);
        var P0 = CUE_SYNC + 0.14;
        var PD = 0.76;
        tl.fromTo($("pulse"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, P0);
        tl.fromTo($("pulse"), { x: 0 }, { x: 616, duration: PD, ease: "power2.inOut" }, P0);
        tl.fromTo($("lit"), { scaleX: 0 }, { scaleX: 1, duration: PD, ease: "power2.inOut" }, P0);
        // pulse passes each dot: dot 1 at start, dot 2 at the midpoint (inOut → 50% time = 50% travel)
        tl.fromTo($("d1"), { scale: 1 }, { scale: 1.5, duration: 0.12, ease: "power2.out" }, P0);
        tl.to($("d1"), { scale: 1, duration: 0.3, ease: "power2.out" }, P0 + 0.12);
        tl.fromTo($("d2"), { scale: 1 }, { scale: 1.6, duration: 0.1, ease: "power2.out" }, P0 + PD * 0.5 - 0.04);
        tl.to($("d2"), { scale: 1, duration: 0.3, ease: "power2.out" }, P0 + PD * 0.5 + 0.06);
        // arrival: pulse dissolves into a soft glow on the third dot
        tl.to($("pulse"), { opacity: 0, duration: 0.25, ease: "power1.out" }, P0 + PD - 0.06);
        tl.fromTo($("d3"), { scale: 1 }, { scale: 1.45, duration: 0.14, ease: "power2.out" }, P0 + PD - 0.04);
        tl.to($("d3"), { scale: 1.15, duration: 0.4, ease: "power2.out" }, P0 + PD + 0.1);
        tl.fromTo(
          $("glow"),
          { opacity: 0, scale: 0.5 },
          { opacity: 0.45, scale: 1, duration: 0.45, ease: "power2.out" },
          P0 + PD - 0.08
        );
        // quiet settle through the hold (bounded, no loop)
        tl.to($("glow"), { opacity: 0.36, scale: 1.06, duration: D - (P0 + PD + 0.37), ease: "sine.inOut" }, P0 + PD + 0.37);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
